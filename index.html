<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>视频播放接口测试</title>
</head>
<body>
    <h3>视频接口请求结果</h3>
    <div id="result"></div>
    <script>
        const resultDom = document.getElementById('result');
        // 替换成你的视频接口地址
        const apiUrl = "https://baike.baidu.com/xxx/videoapi";

        async function runTest() {
            resultDom.innerText = "正在发起视频接口请求...\n";
            try {
                const resp = await fetch(apiUrl, {
                    method: "GET",
                    headers: {
                        "User-Agent": "Mozilla/5.0 (Windows NT 10.0; Win64; x64; rv:156.0) Gecko/20100101"
                    }
                });
                const json = await resp.json();
                resultDom.innerText = "成功返回数据：" + JSON.stringify(json);
            } catch (err) {
                resultDom.innerText = "捕获错误：" + err.message + "\n";
                console.error(err);
            }
        }
        runTest();
    </script>
</body>
</html>
