<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>视频接口 - CORS代理测试</title>
    <style>
        body {font-family: system-ui; padding: 20px;}
        #result {white-space: pre-wrap; margin-top:20px;}
    </style>
</head>
<body>
    <h3>视频播放接口（代理转发）</h3>
    <button id="btn">发起请求</button>
    <div id="result">等待点击...</div>

    <script>
        const resultDom = document.getElementById('result');
        const btn = document.getElementById('btn');

        // 👉这里替换成你的视频接口完整地址
        const originApi = "https://baike.baidu.com/xxx/videoapi";
        // 公共CORS代理
        const proxy = "https://corsproxy.io/?";
        const apiUrl = proxy + encodeURIComponent(originApi);

        btn.onclick = async function() {
            resultDom.innerText = "正在请求...\n";
            try {
                const resp = await fetch(apiUrl, {
                    method: "GET",
                    headers: {
                        "User-Agent": "Mozilla/5.0 (Windows NT 10.0; Win64; x64; rv:156.0) Gecko/20100101"
                    }
                });
                const json = await resp.json();
                resultDom.innerText = "✅成功拿到返回数据：\n" + JSON.stringify(json, null, 2);
            } catch (err) {
                resultDom.innerText = "❌失败：" + err.message + "\n";
                console.error(err);
            }
        }
    </script>
</body>
</html>
